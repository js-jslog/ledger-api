# pnpm 11 reads its settings from this file, not from package.json. It must be
# committed: `pnpm install --frozen-lockfile` from the README needs it, and it is
# the only place the setting below can live.
#
# `allowBuilds` is the postinstall-script allowlist, and it is EMPTY BY
# MEASUREMENT rather than by omission. No package in the tree declares a
# `preinstall`, `install` or `postinstall` script, so there is nothing to allowlist.
# vitest 4 transforms via rolldown rather than esbuild, which is the dependency this
# entry is usually needed for.
#
# Measure it against a tree rebuilt from the lockfile, not the one in place:
# node_modules/.pnpm retains directories for packages that have been removed, so a
# scan of it reports dependencies the project no longer has.
#
# Keeping the key present and empty is deliberate: it says the question was asked.
# Re-check it whenever a dependency is added, because that is the only moment the
# answer can change.
#
# WHY THIS MATTERS ANYWAY, because the failure mode is disproportionate. When a
# dependency with a build script is added and is not listed here, pnpm 11 does not
# warn. It fails EVERY `pnpm <script>` invocation, because the pre-script
# dependency-status check shells out to `pnpm install` and inherits its non-zero
# exit. Verified here on pnpm 11.18.0 by adding a dependency with a postinstall
# script: `pnpm typecheck`, `pnpm lint` and `pnpm test` all died identically, deep
# inside `runDepsStatusCheck`, with no mention of the real cause in the trace. The
# presenting symptom is "the toolchain is completely broken".
#
# The fix is to add the package here as `<name>: true`.
#
# Two spellings that look right and fail SILENTLY, which every tutorial and most
# generated code will suggest:
#
#   package.json -> "pnpm": { "onlyBuiltDependencies": [...] }
#       No longer read at all by pnpm 11. The only place it surfaces is
#       `pnpm config list`.
#
#   pnpm-workspace.yaml -> onlyBuiltDependencies: [...]
#       The pnpm 9/10 key, superseded by the `allowBuilds` map. Right file, wrong
#       key, build still ignored.
#
# Both of those failure modes are version-dependent, which is why `packageManager`
# in package.json pins pnpm to an exact version rather than a range: otherwise the
# fix is only as reliable as whichever pnpm the next machine happens to have.
# See docs/residual-risk-catalogue.md R18.
allowBuilds: {}
